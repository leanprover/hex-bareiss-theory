name = "hex-bareiss-theory"
defaultTargets = ["HexBareissTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMatrixTheory"
git = "https://github.com/leanprover/hex-matrix-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexBareiss"
git = "https://github.com/leanprover/hex-bareiss.git"
rev = "v0.10.0"

[[require]]
name = "HexDeterminantTheory"
git = "https://github.com/leanprover/hex-determinant-theory.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexBareissTheory"

[[lean_lib]]
name = "HexBareissTheoryTests"
globs = ["HexBareissTheory.Tests"]
